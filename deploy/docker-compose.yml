services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: harness-postgres
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: harness-redis
    ports:
      # 避免占用宿主机已有的本地 Redis（容器间仍使用 redis:6379）。
      - "6380:6379"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: harness-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: harness
      RABBITMQ_DEFAULT_PASS: harness
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: harness-backend
    env_file:
      - ../backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://harness:harness@postgres:5432/harness
      REDIS_URL: redis://redis:6379/0
      MQ_ENABLED: "true"
      RABBITMQ_URL: amqp://harness:harness@rabbitmq:5672/
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      APP_ENV: dev
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  obs-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: harness-obs-worker
    command: ["python", "-m", "app.workers.obs_worker"]
    healthcheck:
      disable: true
    env_file:
      - ../backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://harness:harness@postgres:5432/harness
      REDIS_URL: redis://redis:6379/0
      MQ_ENABLED: "true"
      RABBITMQ_URL: amqp://harness:harness@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  session-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: harness-session-worker
    command: ["python", "-m", "app.workers.session_worker"]
    healthcheck:
      disable: true
    env_file:
      - ../backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://harness:harness@postgres:5432/harness
      REDIS_URL: redis://redis:6379/0
      MQ_ENABLED: "true"
      RABBITMQ_URL: amqp://harness:harness@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: harness-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  rabbitmqdata:
