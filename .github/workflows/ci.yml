# ============================================================
# CI —— 每次 push / PR 自动执行
#   backend   : ruff 静态检查 + mypy 类型检查 + pytest 测试
#   frontend  : npm ci + 生产构建
#   docker    : 构建并推送 backend/frontend 镜像到 GHCR
#               (仅 main 分支 push 时执行)
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  # GHCR 要求仓库名全小写,转小写避免 "must be lowercase" 错误
  IMAGE_NAME: ${{ lower(github.repository) }}

jobs:
  backend:
    name: Backend lint & test
    runs-on: ubuntu-latest
    services:
      # 测试需要真实 PostgreSQL + pgvector
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: harness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harness -d harness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Ruff lint
        working-directory: backend
        run: ruff check app tests

      - name: Mypy type check
        working-directory: backend
        run: mypy app

      - name: Pytest
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://harness:harness@localhost:5432/harness
          MCP_SECRET_KEY: ci-test-mcp-secret
        run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  docker:
    name: Build & push images to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
